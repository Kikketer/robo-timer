<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2:30 Timer Sign</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: 'Arial Black', Arial, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      box-sizing: border-box;
      position: relative;
      padding: 5vh 0 2vh 0;
    }
    #timer {
      font-size: 35vw;
      letter-spacing: 0.05em;
      text-align: center;
      user-select: none;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      max-height: 80vh;
      cursor: pointer;
    }
    #timer.editing {
      cursor: default;
    }
    #timer input {
      background: transparent;
      border: none;
      border-bottom: 2px solid #555;
      color: #fff;
      font-size: inherit;
      font-family: inherit;
      text-align: center;
      outline: none;
      width: 1.2em;
      padding: 0;
      margin: 0;
    }
    #timer input:focus {
      border-bottom-color: #0af;
    }
    #timer .colon {
      margin: 0 0.1em;
    }
    #controls {
      display: flex;
      flex-direction: row;
      gap: 2vw;
      justify-content: center;
      align-items: center;
      padding-bottom: 2vh;
    }
    button {
      font-size: 1.2rem;
      background: #333;
      color: #aaa;
      border: 1px solid #555;
      padding: 0.5rem 1.2rem;
      border-radius: 0.3rem;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
      opacity: 0.7;
    }
    button:hover {
      background: #444;
      opacity: 0.9;
    }
    button.hidden {
      display: none;
    }
    @media (max-width: 600px) {
      #timer { font-size: 20vh; }
      button { font-size: 1rem; padding: 0.4rem 1rem; }
      #controls { gap: 3vw; }
    }
  </style>
</head>
<body>
  <div id="timer">2:30</div>
  <div id="controls">
    <button id="start">Start</button>
    <button id="pause">Pause</button>
    <button id="reset">Reset</button>
  </div>

  <script>
    let duration = 150; // seconds for 2:30
    let timeLeft = duration;
    let running = false;
    let interval = null;
    let isEditing = false;

    const timerEl = document.getElementById('timer');
    const startBtn = document.getElementById('start');
    const pauseBtn = document.getElementById('pause');
    const resetBtn = document.getElementById('reset');

    function pad(n) {
      return n < 10 ? "0" + n : n;
    }

    function updateDisplay() {
      if (isEditing) return; // Don't update display while editing
      const m = Math.floor(timeLeft / 60);
      const s = timeLeft % 60;
      timerEl.textContent = `${m}:${pad(s)}`;
    }

    function updateButtonVisibility() {
      if (running) {
        startBtn.classList.add('hidden');
      } else {
        startBtn.classList.remove('hidden');
      }
    }

    function playBeep() {
      // Simple beep using WebAudio; guaranteed to work without files
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = 440;
      gain.gain.value = 0.2;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(0);
      setTimeout(() => osc.stop(), 600);
      osc.onended = () => ctx.close();
    }

    function startTimer() {
      if (running) return;
      if (timeLeft <= 0) return;
      running = true;
      updateButtonVisibility();
      interval = setInterval(function() {
        if (timeLeft > 0) {
          timeLeft--;
          updateDisplay();
          if (timeLeft === 0) {
            running = false;
            clearInterval(interval);
            updateDisplay();
            updateButtonVisibility();
            playBeep();
          }
        }
      }, 1000);
    }

    function pauseTimer() {
      if (!running) return;
      running = false;
      if (interval) clearInterval(interval);
      updateButtonVisibility();
    }

    function resetTimer() {
      pauseTimer();
      timeLeft = duration;
      updateDisplay();
      updateButtonVisibility();
    }

    function enableEditMode() {
      if (running || isEditing) return; // Don't edit while timer is running or already editing
      isEditing = true;
      timerEl.classList.add('editing');
      
      const m = Math.floor(timeLeft / 60);
      const s = timeLeft % 60;
      
      // Create input elements
      timerEl.innerHTML = `
        <input type="text" id="minutesInput" value="${m}" maxlength="2" />
        <span class="colon">:</span>
        <input type="text" id="secondsInput" value="${pad(s)}" maxlength="2" />
      `;
      
      const minutesInput = document.getElementById('minutesInput');
      const secondsInput = document.getElementById('secondsInput');
      
      // Focus and select minutes input
      minutesInput.focus();
      minutesInput.select();
      
      // Handle input validation and navigation
      function handleInput(e) {
        const input = e.target;
        const value = input.value;
        
        // Only allow digits
        if (!/^\d*$/.test(value)) {
          input.value = value.replace(/\D/g, '');
        }
      }
      
      function handleKeyDown(e) {
        if (e.key === 'Enter') {
          disableEditMode(true);
        } else if (e.key === 'Escape') {
          disableEditMode(false);
        }
      }
      
      minutesInput.addEventListener('input', handleInput);
      secondsInput.addEventListener('input', handleInput);
      minutesInput.addEventListener('keydown', handleKeyDown);
      secondsInput.addEventListener('keydown', handleKeyDown);
      
      // Handle blur to save changes
      function handleBlur(e) {
        // Delay to allow clicking on the other input
        setTimeout(() => {
          if (document.activeElement !== minutesInput && document.activeElement !== secondsInput) {
            disableEditMode(true);
          }
        }, 100);
      }
      
      minutesInput.addEventListener('blur', handleBlur);
      secondsInput.addEventListener('blur', handleBlur);
    }

    function disableEditMode(save) {
      if (!isEditing) return;
      
      const minutesInput = document.getElementById('minutesInput');
      const secondsInput = document.getElementById('secondsInput');
      
      if (save && minutesInput && secondsInput) {
        let minutes = parseInt(minutesInput.value) || 0;
        let seconds = parseInt(secondsInput.value) || 0;
        
        // Validate ranges
        if (minutes > 59) minutes = 59;
        if (minutes < 0) minutes = 0;
        if (seconds > 59) seconds = 59;
        if (seconds < 0) seconds = 0;
        
        // Prevent 0:0
        if (minutes === 0 && seconds === 0) {
          minutes = 0;
          seconds = 1;
        }
        
        // Update duration and timeLeft
        duration = minutes * 60 + seconds;
        timeLeft = duration;
      }
      
      isEditing = false;
      timerEl.classList.remove('editing');
      updateDisplay();
    }

    // Add click handler to timer
    timerEl.addEventListener('click', enableEditMode);

    startBtn.onclick = startTimer;
    pauseBtn.onclick = pauseTimer;
    resetBtn.onclick = resetTimer;

    updateDisplay();
    updateButtonVisibility();
  </script>
</body>
</html>
