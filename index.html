<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2:30 Timer Sign</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: 'Arial Black', Arial, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      box-sizing: border-box;
      position: relative;
    }
    #timer {
      font-size: 35vw;
      letter-spacing: 0.05em;
      text-align: center;
      user-select: none;
      line-height: 1;
    }
    #controls {
      position: fixed;
      left: 2vw;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 1.5vw;
    }
    button {
      font-size: 1.5vw;
      background: #222;
      color: #fff;
      border: none;
      padding: 0.8vw 1.5vw;
      border-radius: 0.5vw;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
      min-width: 8vw;
    }
    button:hover {
      background: #444;
    }
    button.hidden {
      display: none;
    }
    @media (max-width: 600px) {
      #timer { font-size: 25vw; }
      button { font-size: 3vw; min-width: 15vw; }
      #controls { gap: 3vw; }
    }
  </style>
</head>
<body>
  <div id="timer">2:30</div>
  <div id="controls">
    <button id="start">Start</button>
    <button id="pause">Pause</button>
    <button id="reset">Reset</button>
  </div>

  <script>
    let duration = 150; // seconds for 2:30
    let timeLeft = duration;
    let running = false;
    let interval = null;

    const timerEl = document.getElementById('timer');
    const startBtn = document.getElementById('start');
    const pauseBtn = document.getElementById('pause');
    const resetBtn = document.getElementById('reset');

    function pad(n) {
      return n < 10 ? "0" + n : n;
    }

    function updateDisplay() {
      const m = Math.floor(timeLeft / 60);
      const s = timeLeft % 60;
      timerEl.textContent = `${m}:${pad(s)}`;
    }

    function updateButtonVisibility() {
      if (running) {
        startBtn.classList.add('hidden');
      } else {
        startBtn.classList.remove('hidden');
      }
    }

    function playBeep() {
      // Simple beep using WebAudio; guaranteed to work without files
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = 440;
      gain.gain.value = 0.2;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(0);
      setTimeout(() => osc.stop(), 600);
      osc.onended = () => ctx.close();
    }

    function startTimer() {
      if (running) return;
      if (timeLeft <= 0) return;
      running = true;
      updateButtonVisibility();
      interval = setInterval(function() {
        if (timeLeft > 0) {
          timeLeft--;
          updateDisplay();
          if (timeLeft === 0) {
            running = false;
            clearInterval(interval);
            updateDisplay();
            updateButtonVisibility();
            playBeep();
          }
        }
      }, 1000);
    }

    function pauseTimer() {
      if (!running) return;
      running = false;
      if (interval) clearInterval(interval);
      updateButtonVisibility();
    }

    function resetTimer() {
      pauseTimer();
      timeLeft = duration;
      updateDisplay();
      updateButtonVisibility();
    }

    startBtn.onclick = startTimer;
    pauseBtn.onclick = pauseTimer;
    resetBtn.onclick = resetTimer;

    updateDisplay();
    updateButtonVisibility();
  </script>
</body>
</html>
