name: Update README with random number on PR merge

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

jobs:
  update-readme:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Generate random number and update README
        run: |
          RANDOM_NUM=$((RANDOM))
          echo "Random Number: $RANDOM_NUM" > README.md

      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.WARG_APP_ID }}
          private-key: ${{ secrets.WARG_SECRET }}

      - name: Echo whoami for token
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          curl -H "Authorization: Bearer ${APP_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/app

      - name: Configure git
        run: |
          git config user.name 'perm-warg[bot]'
          git config user.email 'perm-warg[bot]@users.noreply.github.com'

      - name: Commit and push updated README.md
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git add README.md
          git commit -m "Update README with random number [skip ci]" || exit 0
          git push https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
