name: Update README with random number on PR merge

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  update-readme:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Generate random number and update README
        run: |
          RANDOM_NUM=$((RANDOM))
          echo "Random Number: $RANDOM_NUM" > README.md

      - name: Commit and push changes (as GitHub App)
        uses: tibdex/github-app-token@v2
        id: app-token
        with:
          app_id: ${{ secrets.WARG_APP_ID }}
          private_key: ${{ secrets.WARG_SECRET }}

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Commit and push updated README.md
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git add README.md
          git commit -m "Update README with random number [skip ci]" || exit 0
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
